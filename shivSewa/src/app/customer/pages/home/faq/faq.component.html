<section class="faq-section">
  <div class="faq-container">
    <div class="header-content">
      <p class="subtitle">Got Questions?</p>
      <h2 class="main-title">Frequently Asked Questions</h2>
      <p class="section-description">Everything you need to know before booking your ride with Shiv Sewa.</p>
    </div>

    <div class="faq-list">
      <div
        *ngFor="let item of faqs; let i = index"
      >
        <h3 class="faq-category-heading" *ngIf="isCategoryStart(i)">{{ item.category }}</h3>
        <div
        class="faq-item"
        [class.active]="activeIndex === i"
        (click)="toggle(i)"
      >
        <div class="faq-question">
          <span class="faq-number">{{ (i + 1).toString().padStart(2, '0') }}</span>
          <span class="faq-q-text">{{ item.question }}</span>
          <span class="faq-icon">
            <i *ngIf="activeIndex !== i" class="pi pi-plus"></i>
            <i *ngIf="activeIndex === i" class="pi pi-minus"></i>
          </span>
        </div>
        <div class="faq-answer">
          <p *ngIf="item.answer">{{ item.answer }}</p>
          <ol *ngIf="item.points?.length" class="faq-points">
            <li *ngFor="let point of item.points">{{ point }}</li>
          </ol>
          <p *ngIf="item.note">{{ item.note }}</p>
        </div>
        </div>
      </div>
    </div>
  </div>
</section>
